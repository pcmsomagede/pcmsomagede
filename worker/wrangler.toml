name = "pcmsomagede-cms-api"
main = "src/index.ts"
compatibility_date = "2026-08-17"

[vars]
GITHUB_OWNER = "pcmsomagede"
GITHUB_REPO = "pcmsomagede"
PUBLIC_SITE_ORIGIN = "https://pcmsomagede.github.io"

[secrets]
required = ["ADMIN_USER", "ADMIN_PASSWORD", "SESSION_SECRET"]

# Secret values are never committed.
# GITHUB_TOKEN is also required by /api/publish and remains managed as a Worker secret.
