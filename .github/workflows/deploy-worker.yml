name: Deploy CMS Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Worker secrets
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const required = ['ADMIN_USER', 'ADMIN_PASSWORD', 'SESSION_SECRET'];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) {
            console.error(`Missing GitHub Actions secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          const data = Object.fromEntries(required.map((key) => [key, process.env[key]]));
          fs.writeFileSync('worker/.secrets.production.json', JSON.stringify(data));
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --config worker/wrangler.toml --secrets-file worker/.secrets.production.json

      - name: Remove temporary secrets file
        if: always()
        run: rm -f worker/.secrets.production.json
