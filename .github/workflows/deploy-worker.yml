name: Deploy CMS Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$ADMIN_USER" || { echo 'ADMIN_USER is missing'; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo 'ADMIN_PASSWORD is missing'; exit 1; }
          test -n "$SESSION_SECRET" || { echo 'SESSION_SECRET is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Deploy Worker code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --config worker/wrangler.toml

      - name: Publish ADMIN_USER secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.ADMIN_USER }}
        run: printf '%s' "$VALUE" | npx wrangler@latest secret put ADMIN_USER --config worker/wrangler.toml

      - name: Publish ADMIN_PASSWORD secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.ADMIN_PASSWORD }}
        run: printf '%s' "$VALUE" | npx wrangler@latest secret put ADMIN_PASSWORD --config worker/wrangler.toml

      - name: Publish SESSION_SECRET secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.SESSION_SECRET }}
        run: printf '%s' "$VALUE" | npx wrangler@latest secret put SESSION_SECRET --config worker/wrangler.toml
